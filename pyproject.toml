[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-web-provider"
version = "0.3.0.dev0"
description = "In-process browser automation runtime for AI web providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "pillow>=10.3",
    "camoufox[geoip]>=0.4",
    "playwright>=1.44",
    "httpx>=0.27",
]

[project.optional-dependencies]
google-flow = []
perplexity = []
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-asyncio>=0.24",
    "types-PyYAML",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
required_plugins = ["pytest-asyncio"]
[tool.hatch.build.targets.wheel]
packages = ["src/ai_proxy", "src/ai_web_provider"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "ai_proxy.core.browser.camoufox_backend"
disallow_untyped_calls = false
