[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-proxy"
version = "0.3.0.dev0"
description = "Multi-provider automation proxy (library + CLI + service) around web AI apps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "aiofiles>=23.2",
    "pillow>=10.3",
    "camoufox[geoip]>=0.4",
    "playwright>=1.44",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "sse-starlette>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Placeholder extras reserving per-provider dependency names; provider-specific deps are
# declared here once a provider needs more than the base install (Phase 9+).
google-flow = []
perplexity = []
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-aiofiles",
]

[project.scripts]
aip = "ai_proxy.cli.main:app"
ai-proxy-api = "ai_proxy.core.service.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_proxy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# ASYNC109/ASYNC240: this project is asyncio-native (not trio/anyio) and uses
# `timeout` kwargs idiomatically (as playwright/httpx do); those two rules don't apply.
ignore = ["ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
# Typer's recommended pattern is `= typer.Option(...)` in the function signature.
"src/ai_proxy/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# camoufox ships without a py.typed marker, so calls into it are "untyped" to mypy.
module = "ai_proxy.core.browser.camoufox_backend"
disallow_untyped_calls = false
